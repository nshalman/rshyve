[workspace]
resolver = "2"

members = [
    "crates/bhyve-api",
    "crates/bhyve-api/sys",
    "crates/viona-api",
    "crates/vmm-api-common",
    "crates/vmm-core",
    "crates/vmm-devices",
    "crates/vmm-migrate",
    "crates/vmm-config",
    "crates/vmm-hyperv",
    "crates/vmm-tpm-sys",
    "crates/vmm-tpm",
    "bin/vmm",
    "bin/vmm-migrate-agent",
]

[profile.dev-abort]
inherits = "dev"
panic = "abort"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "debuginfo"

[workspace.dependencies]
# Internal crates
bhyve_api = { path = "crates/bhyve-api" }
bhyve_api_sys = { path = "crates/bhyve-api/sys" }
viona_api = { path = "crates/viona-api" }
vmm_api_common = { path = "crates/vmm-api-common" }
vmm_core = { path = "crates/vmm-core" }
vmm_devices = { path = "crates/vmm-devices" }
vmm_migrate = { path = "crates/vmm-migrate" }
vmm_config = { path = "crates/vmm-config" }
vmm_hyperv = { path = "crates/vmm-hyperv" }
vmm_tpm_sys = { path = "crates/vmm-tpm-sys" }
vmm_tpm = { path = "crates/vmm-tpm" }

# External dependencies
anyhow = "1.0"
ascii = { version = "1.1", default-features = false }
usdt = { version = "0.5", default-features = false }
bitflags = "2.4"
clap = { version = "4.2", features = ["derive"] }
futures = "0.3"
libc = "0.2"
ron = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
slog = "2.7"
slog-async = "2.8"
slog-term = "2.8"
strum = "0.26"
thiserror = "1.0"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.21"
toml = "0.8"
uuid = { version = "1.3", features = ["v4"] }
des = "0.8"
erased-serde = "0.4"
