[workspace]
resolver = "2"

members = [
    "crates/bhyve-api",
    "crates/bhyve-api/sys",
    "crates/viona-api",
    "crates/dladm",
    "crates/vmm-api-common",
    "crates/vmm-core",
    "crates/vmm-devices",
    "crates/vmm-virtio",
    "crates/vmm-storage",
    "crates/vmm-hid",
    "crates/vmm-rdp",
    "crates/vmm-passthru",
    "crates/vmm-metrics",
    "crates/vmm-devices-testsupport",
    "crates/vmm-boot",
    "crates/vmm-migrate",
    "crates/vmm-config",
    "crates/vmm-hyperv",
    "crates/vmm-tpm-sys",
    "crates/vmm-tpm",
    "crates/vmm-machine",
    "crates/vmm-mantablock",
    "bin/rshyve",
    "bin/firehyve",
    "tools/fhrun",
]

# fhrun-init cross-compiles to x86_64-unknown-linux-musl and carries
# its own workspace and lockfile. Excluding it keeps a host
# `cargo build --workspace` off the Linux toolchain.
exclude = [
    "fuzz",
    "tools/fhrun-init",
    "tools/virtiofs-test",
]

[workspace.package]
# The oldest toolchain this is built with is the illumos build host's
# 1.94.1. Verified by the msrv job in CI; raise both together.
rust-version = "1.94"

[workspace.lints.rust]
rust_2018_idioms = { level = "warn", priority = -1 }
unused_qualifications = "warn"

[workspace.lints.clippy]
# The one deny-by-default clippy group, and the one that catches
# undefined behaviour (uninit_assumed_init, invalid_null_ptr_usage,
# size_of_in_element_count). The baseline is clean, so denying it costs
# nothing and is worth more than a warning in a hypervisor.
correctness = { level = "deny", priority = -1 }
suspicious = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
# `const _: () = assert!(...)` is an intentional compile-time layout check.
assertions_on_constants = "allow"
# Callback and device registry shapes are clearer at their use sites unless a
# domain-specific alias has an obvious name.
type_complexity = "allow"

[profile.dev-abort]
inherits = "dev"
panic = "abort"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "debuginfo"

[workspace.dependencies]
# Internal crates
bhyve_api = { path = "crates/bhyve-api" }
bhyve_api_sys = { path = "crates/bhyve-api/sys" }
viona_api = { path = "crates/viona-api" }
dladm = { path = "crates/dladm" }
vmm_api_common = { path = "crates/vmm-api-common" }
vmm_core = { path = "crates/vmm-core" }
vmm_devices = { path = "crates/vmm-devices" }
vmm_rdp = { path = "crates/vmm-rdp" }
vmm_virtio = { path = "crates/vmm-virtio" }
vmm_storage = { path = "crates/vmm-storage" }
vmm_hid = { path = "crates/vmm-hid" }
vmm_passthru = { path = "crates/vmm-passthru" }
vmm_metrics = { path = "crates/vmm-metrics" }
vmm_devices_testsupport = { path = "crates/vmm-devices-testsupport" }
vmm_boot = { path = "crates/vmm-boot" }
vmm_migrate = { path = "crates/vmm-migrate" }
vmm_config = { path = "crates/vmm-config" }
vmm_hyperv = { path = "crates/vmm-hyperv" }
vmm_tpm_sys = { path = "crates/vmm-tpm-sys" }
vmm_tpm = { path = "crates/vmm-tpm" }
vmm_machine = { path = "crates/vmm-machine" }
vmm_mantablock = { path = "crates/vmm-mantablock" }

# External dependencies
# The engine pins the same commit. Move both together: a new commit can
# change the ring layout.
manta-block-ring = { git = "https://github.com/TritonDataCenter/manta-block-ring", rev = "674466d7346a631e20d906b1138e2f7427bef8a4" }
acpi_tables = "0.2.1"
anyhow = "1.0"
base64 = "0.21"
crc32fast = "1.4"
crossbeam-channel = "0.5"
ascii = { version = "1.1", default-features = false }
usdt = { version = "0.5", default-features = false }
bitflags = "2.4"
clap = { version = "4.2", features = ["derive"] }
futures = "0.3"
getrandom = "0.4"
libc = "0.2"
memmap2 = "0.9"
ron = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
slog = "2.7"
slog-async = "2.8"
slog-term = "2.8"
strum = "0.26"
thiserror = "1.0"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.21"
toml = "0.8"
uuid = { version = "1.3", features = ["v4"] }
des = "0.8"
# zlib for the VNC server's ZRLE encoding. The default backend is
# miniz_oxide, pure Rust, so no C library joins the build.
flate2 = "1"
# RDP server for remote displays. `helper` loads the TLS certificate and
# key; async-trait and bytes appear in its handler traits.
# `nscodec` is the only codec the macOS Windows App client offers.
ironrdp-server = { version = "0.13", features = ["helper", "nscodec", "egfx"] }
# The codec capability types the server advertises.
ironrdp-pdu = "0.9"
# The RemoteFX Progressive tile encoder and its decoder, for EGFX.
ironrdp-graphics = "0.9"
# EGFX: its pipeline server, and the DVC and SVC framing its output needs.
ironrdp-egfx = "0.3"
ironrdp-dvc = "0.8"
ironrdp-svc = "0.8"
ironrdp-core = "0.2"
# The audio formats the rdpsnd channel offers.
ironrdp-rdpsnd = "0.9"
# The monitor layout type in RdpServerDisplay::request_layout.
ironrdp-displaycontrol = "0.8"
async-trait = "0.1"
# IronRDP logs through tracing; vmm_rdp forwards it to slog.
tracing = "0.1"
bytes = "1"
erased-serde = "0.4"
# Proves at compile time that a type may be read from, or written to, a
# byte buffer. A `Copy` bound cannot: it admits a type with padding, and
# a type whose bit patterns are not all valid.
zerocopy = { version = "0.8", features = ["derive"] }
