[package]
name = "vmm_migrate"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
license = "MPL-2.0"

[lints]
workspace = true

[dependencies]
vmm_core.workspace = true
vmm_devices.workspace = true
bhyve_api.workspace = true
# Pure Rust, as in vmm-hid, which makes the VRAM form.
lz4_flex = { version = "0.14", default-features = false, features = ["std", "safe-encode", "safe-decode", "checked-decode"] }
ron.workspace = true
rustix = { version = "1", features = ["event", "fs", "net"] }
serde.workspace = true
slog.workspace = true
thiserror.workspace = true
tungstenite = "0.21"
zstd = "0.13"

[dev-dependencies]
tempfile = "3"
