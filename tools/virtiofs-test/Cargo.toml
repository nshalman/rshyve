# Standalone Cargo project, deliberately outside the vmmnew workspace,
# for the same reason as tools/fhrun-init: this binary cross-compiles to
# x86_64-unknown-linux-musl and runs only inside a guest. Folding it into
# the workspace would make every host build learn a Linux toolchain. The
# root manifest names it in `exclude` so path discovery skips it too.

[package]
name = "virtiofs-test"
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"
description = "PID 1 that mounts a virtio-fs share and reports on it."

[[bin]]
name = "virtiofs-test"
path = "src/main.rs"

# Literal version pins, not `.workspace = true`: this package inherits
# nothing from the vmmnew workspace.
[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

# Marks this directory as its own workspace root so Cargo does not fold
# it into the workspace above.
[workspace]
