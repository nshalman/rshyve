[advisories]
# Surface stale exceptions rather than hiding them: if an ignored
# advisory stops matching, the entry should be removed, not left to rot.
unused-ignored-advisory = "warn"
ignore = [
    # Owner: VMM maintainers. Review by 2026-11-17. memmap 0.7 is reached only
    # through usdt 0.5; upgrading first requires an illumos diff of the `vmm`
    # provider probe names, which are declared in the `usdt::provider` blocks
    # (crates/vmm-core/src/pio.rs, vmm-machine/src/vcpu_tasks.rs,
    # vmm-virtio/src/block.rs, vmm-hid/src/ps2/ctrl.rs) and consumed by
    # tools/profile/.
    { id = "RUSTSEC-2020-0077", reason = "VMM maintainers; review by 2026-11-17; preserve the vmm provider probe names until an illumos probe-name diff is complete" },
    # Owner: migration maintainers. Review by 2026-11-17. rand 0.8.5 is reached
    # only through tungstenite 0.21, whose `log` feature is disabled, so the
    # custom-logger rand::rng() path is unreachable. Remediation requires moving
    # the tokio-tungstenite/tungstenite pair together.
    #
    # This entry currently matches nothing and cargo-deny says so: the advisory
    # is informational (`unsound`), which cargo-deny does not surface by default
    # while cargo audit does. The entry is kept deliberately so the exception is
    # already in place if that changes. unused-ignored-advisory is "warn" rather
    # than "allow" precisely so this stays visible.
    { id = "RUSTSEC-2026-0097", reason = "Migration maintainers; review by 2026-11-17; tungstenite's log feature is disabled, and remediation requires upgrading the WebSocket pair together" },
    # Owner: remote display maintainers. Review by 2026-12-31. The three
    # entries below arrive with IronRDP (vmm_rdp) and have no fixed release.
    #
    # rsa 0.10.0-rc (the Marvin timing attack on PKCS#1 v1.5 decryption) is
    # reached only through picky and sspi, IronRDP's certificate, CredSSP and
    # Kerberos stack. vmm_rdp serves TLS through rustls on aws-lc and does not
    # enable NLA, so no RSA decryption with its key should go through this
    # crate. That is believed, NOT verified: confirm it before this lands.
    { id = "RUSTSEC-2023-0071", reason = "Remote display maintainers; review by 2026-12-31; rsa reached only via IronRDP's picky/sspi, unverified as unreachable, no fixed release" },
    # atomic-polyfill is archived; reached through heapless, iso7816 and
    # winscard, sspi's smart-card support, on some targets only.
    { id = "RUSTSEC-2023-0089", reason = "Remote display maintainers; review by 2026-12-31; archived, reached only via IronRDP, no maintained replacement upstream yet" },
    # rustls-pemfile is archived; IronRDP's TLS helper reads PEM with it.
    { id = "RUSTSEC-2025-0134", reason = "Remote display maintainers; review by 2026-12-31; archived, reached only via ironrdp-server's TLS helper" },
]

[licenses]
unused-allowed-license = "allow"
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    # BSD-3-Clause and ISC arrive with IronRDP (vmm_rdp): the dalek curves
    # and subtle; rustls-webpki, untrusted, libloading, iso7816-tlv and
    # aws-lc. Both are permissive, like the rest of this list.
    "BSD-3-Clause",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "deny"
# depth = 1 so an exception covers only the crate's own direct
# dependencies. Without it, the whole subtree under each entry is exempt,
# which silently swallows unrelated duplicates (syn, proc-macro2, serde,
# libc) and would let a future split in any of them pass this gate.
skip-tree = [
    # slog remains on 0.3 while vmm_devices uses the 0.4 erased-serde API.
    { crate = "erased-serde", depth = 1, reason = "slog pins 0.3 while vmm_devices uses 0.4" },
    # rand/tungstenite needs 0.2, jobserver needs 0.3, and uuid/tempfile need 0.4.
    { crate = "getrandom", depth = 1, reason = "independent rand, build-tool, and UUID/tempfile dependency lines cannot yet be unified" },
    # The usdt stack remains on 1 while pest and its derive stack use 2.
    { crate = "thiserror", depth = 1, reason = "usdt pins 1 while pest uses 2" },
    # usdt's DOF writer remains on 0.7 while rand_chacha uses 0.8.
    { crate = "zerocopy", depth = 1, reason = "dof pins 0.7 while rand_chacha uses 0.8" },
    # The proc-macro half of the thiserror split above; it moves with it.
    { crate = "thiserror-impl", depth = 1, reason = "follows the thiserror 1/2 split in the usdt stack" },
    # UEFI backend of the getrandom split above; getrandom 0.3 pulls 5.3
    # through jobserver, getrandom 0.4 pulls 6.0 through tempfile.
    { crate = "r-efi", depth = 1, reason = "follows the getrandom split; not built on any supported target" },
    # The derive half of the zerocopy split above. acpi_tables turns on
    # zerocopy's derive feature at 0.8; dof already uses it at 0.7.
    { crate = "zerocopy-derive", depth = 1, reason = "follows the zerocopy 0.7/0.8 split" },
]
# IronRDP (vmm_rdp) brings release candidates of the RustCrypto stack and
# its own rand, base64 and syn lines beside the versions the rest of the
# tree uses. Each entry skips exactly one version that stack added, so a
# new duplicate anywhere else still fails. Review by 2026-12-31, and drop
# entries as IronRDP settles on released crates.
skip = [
    { crate = "base64@0.22.1", reason = "IronRDP" },
    { crate = "base64@0.23.1", reason = "IronRDP" },
    { crate = "bitflags@1.3.2", reason = "IronRDP" },
    { crate = "block-buffer@0.12.1", reason = "IronRDP" },
    { crate = "cipher@0.5.2", reason = "IronRDP" },
    { crate = "const-oid@0.9.6", reason = "IronRDP" },
    { crate = "cpufeatures@0.3.1", reason = "IronRDP" },
    { crate = "crypto-common@0.2.2", reason = "IronRDP" },
    { crate = "der@0.7.10", reason = "IronRDP" },
    { crate = "des@0.9.0", reason = "IronRDP" },
    { crate = "digest@0.11.3", reason = "IronRDP" },
    { crate = "inout@0.2.2", reason = "IronRDP" },
    { crate = "md-5@0.10.6", reason = "IronRDP" },
    { crate = "num-bigint@0.3.3", reason = "IronRDP" },
    { crate = "pem-rfc7468@0.7.0", reason = "IronRDP" },
    { crate = "pkcs1@0.7.5", reason = "IronRDP" },
    { crate = "rand@0.9.5", reason = "IronRDP" },
    { crate = "rand@0.10.3", reason = "IronRDP" },
    { crate = "rand_chacha@0.9.0", reason = "IronRDP" },
    { crate = "rand_core@0.9.5", reason = "IronRDP" },
    { crate = "rand_core@0.10.1", reason = "IronRDP" },
    { crate = "sha1@0.11.0", reason = "IronRDP" },
    { crate = "sha2@0.11.0", reason = "IronRDP" },
    { crate = "spki@0.7.3", reason = "IronRDP" },
    { crate = "syn@1.0.109", reason = "IronRDP" },
    { crate = "syn@3.0.6", reason = "IronRDP" },
    # ring 0.17, under rustls, asks for windows-sys ^0.52.
    { crate = "windows-sys@0.52.0", reason = "IronRDP" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# The MantaBlock ring crate, pinned to a commit in the root Cargo.toml.
allow-git = ["https://github.com/TritonDataCenter/manta-block-ring"]
