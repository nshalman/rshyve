name: CI

# What this gate does and does not prove.
#
# The target platform is illumos, and GitHub offers no illumos runner.
# Neither binary LINKS anywhere but illumos: bhyve-api binds SunOS
# ioctls and viona-api needs libdladm. Both do type-check here, though.
# firehyve cross-checks against the illumos target, and both binaries
# build and run their tests on the host target, where rshyve's C
# dependencies (zstd-sys, the vendored libtpms that vmm-tpm-sys builds)
# compile natively. See the `binaries` job.
#
# So a green run here means: the tree is formatted, EVERY workspace
# member is clippy-clean under `-D warnings` (the portable ones on the
# host, the bindings and firehyve against the illumos target, rshyve and
# the TPM crates on the host because their C dependencies cannot
# cross-compile), the portable tests pass in both profiles, the
# recorded-ioctl tests of the three illumos binding crates pass, every
# portable crate and its test targets type-check against the illumos
# target, the lockfile is current, and the dependency, unsafe-comment and
# public-surface policies hold. tools/fhrun-init and tools/virtiofs-test
# are excluded from the workspace, so the two guest jobs cover them.
#
# What the clippy coverage does NOT prove: rshyve's
# `cfg(target_os = "illumos")` bodies are linted on the host target only,
# because zstd-sys and the libtpms autotools build need a C toolchain for
# the target. CONTRIBUTING.md records the workspace-wide clippy run the
# illumos build host does.
#
# A green run also means the two platforms compile the same set of
# tests, apart from the gated ones recorded in tools/test-parity.expected
# with a reason. Every job here runs on ubuntu, so without that check a
# test gated to illumos runs nowhere and a test gated away from illumos
# never runs on the product platform. See the `test-parity` job.
#
# It does NOT mean the VMM builds, boots a guest, or passes a platform
# test. Those still run on the illumos build host; see docs/testing.md.
# Do not read this badge as platform coverage.
#
# Why the cross-check is scoped the way it is: vmm_migrate pulls in
# zstd-sys, which needs a cross C toolchain. Those crates are portable,
# so they are covered by the host-target clippy and test jobs instead,
# and their illumos code paths are covered by the build host.
#
# One thing the cross-check cannot prove: usdt's probe macros expand
# from a HOST-built usdt-impl, which selects its backend from the host
# OS. On a linux runner every probe expands to a no-op. Probe emission
# is verified on the build host with `dtrace -l -P vmm`.

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

# Every third-party action is pinned to a commit SHA with the tag it came
# from in a trailing comment. A tag is mutable, and cargo-deny-action is
# the job that vouches for the dependency graph, so a moved tag there
# would be the graph vouching for itself. The gitleaks download in the
# `secrets` job is pinned by version and SHA-256 for the same reason.

env:
  CARGO_TERM_COLOR: always

jobs:
  lock:
    name: lockfile is current
    runs-on:
      group: triton
      labels: [self-hosted, APP]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: cargo metadata --locked --format-version 1 > /dev/null
      - name: Cargo.lock unchanged
        run: git diff --exit-code Cargo.lock

  fmt:
    name: rustfmt
    runs-on:
      group: triton
      labels: [self-hosted, APP]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: rustup component add rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy (portable crates)
    runs-on:
      group: triton
      labels: [self-hosted, APP]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: rustup component add clippy
      - run: >
          cargo clippy --locked --all-targets
          -p vmm_api_common -p dladm -p vmm_core -p vmm_devices -p vmm_devices_testsupport
          -p vmm_config -p vmm_migrate -p vmm_hyperv -p vmm_machine -p vmm_boot
          -p vmm_metrics -p vmm_passthru -p vmm_virtio -p vmm_storage -p vmm_hid -p vmm_mantablock
          -p fhrun
          -- -D warnings

  clippy-illumos:
    name: clippy against the illumos target
    runs-on:
      group: triton
      labels: [self-hosted, APP]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: rustup target add x86_64-unknown-illumos
      - run: rustup component add clippy
      # The workspace denies `clippy::correctness`, which catches
      # undefined behaviour, and those lints only fire under clippy. The
      # ioctl bindings hold most of the `unsafe` in the tree and no
      # clippy job named them, so the deny was inert for exactly the code
      # it was written for. The compile that means anything for them is
      # the one against the real target, so it is this job and not the
      # host one. firehyve rides along: it has no C dependencies, so it
      # cross-compiles, and this is the only job that compiles it for the
      # target. usdt's probe macros expand from a HOST-built usdt-impl,
      # so on a linux runner they are no-ops: every line of firehyve is
      # checked, but not the illumos DTrace codegen, which the build host
      # covers.
      - run: >
          cargo clippy --locked --target x86_64-unknown-illumos --all-targets
          -p bhyve_api_sys -p bhyve_api -p viona_api
          -p firehyve
          -- -D warnings

  cross-check:
    name: illumos bindings type-check
    runs-on:
      group: triton
      labels: [self-hosted, APP]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: rustup target add x86_64-unknown-illumos
      # Every portable crate against the real target, tests included.
      # `--all-targets` is the point of this job: it is the only place
      # in the workflow that COMPILES a `#[cfg(test)]` body behind
      # `cfg(target_os = "illumos")`. The clippy and test jobs build for
      # the host, and the firehyve check in `binaries` reaches these
      # crates as libraries only, so an illumos-only test could stop
      # compiling and no job here would say so.
      #
      # vmm_passthru, vmm_storage and vmm_hid are in the list for a
      # second reason: firehyve does not depend on them, so before this
      # their illumos ioctl code was not compiled against the target at
      # all. Only rshyve reaches them, and rshyve cannot cross-compile.
      #
      # vmm_migrate is left out. zstd-sys needs a C compiler for the
      # target and this runner has no illumos cross-cc. That crate is
      # portable, so the host clippy and test jobs cover it, and its
      # illumos paths are covered on the build host.
      #
      # No linker is needed because check does not link.
      - run: >
          cargo check --locked --all-targets
          --target x86_64-unknown-illumos
          -p bhyve_api_sys -p bhyve_api -p viona_api -p dladm -p vmm_api_common
          -p vmm_config -p vmm_core -p vmm_devices -p vmm_devices_testsupport
          -p vmm_boot -p vmm_metrics -p vmm_machine -p vmm_hyperv
          -p vmm_passthru -p vmm_virtio -p vmm_storage -p vmm_hid -p vmm_mantablock
          -p fhrun

  test:
    name: portable tests
    runs-on:
      group: triton
      labels: [self-hosted, APP]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # Codecs, bounds checks, device register models, and the migration
      # protocol.
      #
      # The three binding crates are here for their tests only. They
      # reach no kernel on this runner: each one drives a recorded ioctl
      # seam over /dev/null and a pipe, and those recordings are the only
      # pins on the command number and the arguments the kernel is given.
      # The bindings are left out of the MSRV job, because the compile
      # that means something for them is the illumos one, which
      # `clippy-illumos` and `cross-check` do. Before this, the build host
      # was the one machine that ran these tests.
      # tools/check-ci-crates.sh asserts that they stay named here.
      - run: >
          cargo test --locked
          -p vmm_api_common -p dladm -p vmm_core -p vmm_devices -p vmm_devices_testsupport
          -p vmm_config -p vmm_migrate -p vmm_hyperv -p vmm_machine -p vmm_boot
          -p vmm_metrics -p vmm_passthru -p vmm_virtio -p vmm_storage -p vmm_hid -p vmm_mantablock
          -p fhrun -p bhyve_api_sys -p bhyve_api -p viona_api
      # Release is the profile that ships, and no job ran it. slog drops
      # `debug!` at compile time there and the optimiser changes what a
      # test can observe, so a green debug run says nothing about it. A
      # test asserting a debug record the shipping binary never emits
      # passed here for the life of the branch.
      - run: >
          cargo test --locked --release
          -p vmm_api_common -p dladm -p vmm_core -p vmm_devices -p vmm_devices_testsupport
          -p vmm_config -p vmm_migrate -p vmm_hyperv -p vmm_machine -p vmm_boot
          -p vmm_metrics -p vmm_passthru -p vmm_virtio -p vmm_storage -p vmm_hid -p vmm_mantablock
          -p fhrun -p bhyve_api_sys -p bhyve_api -p viona_api

  guest-init:
    name: guest init (musl)
    runs-on:
      group: triton
      labels: [self-hosted, APP]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: rustup target add x86_64-unknown-linux-musl
      - run: rustup component add clippy rustfmt
      # tools/fhrun-init is excluded from the root workspace, so no
      # other job here reaches it: it would be unformatted, unlinted and
      # untested code that CI reports green. The runner is x86_64 Linux,
      # so the musl-static test binary also runs natively.
      - name: format, lint and test the guest init
        working-directory: tools/fhrun-init
        run: |
          cargo fmt -- --check
          cargo clippy --locked --all-targets --target x86_64-unknown-linux-musl -- -D warnings
          cargo test --locked --target x86_64-unknown-linux-musl

  guest-vsock-test:
    name: guest test harness (musl)
    runs-on:
      group: triton
      labels: [self-hosted, APP]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: rustup target add x86_64-unknown-linux-musl
      - run: rustup component add clippy rustfmt
      # Same hazard as tools/fhrun-init above: excluded from the root
      # workspace, so no other job reaches it. Its spec parsing decides
      # what a container image actually runs, and that logic is host
      # independent, so it tests on the runner.
      - name: format, lint and test the guest harness
        working-directory: tools/virtiofs-test
        run: |
          cargo fmt -- --check
          cargo clippy --locked --all-targets --target x86_64-unknown-linux-musl -- -D warnings
          cargo test --locked --target x86_64-unknown-linux-musl

  msrv:
    name: builds on the declared MSRV
    runs-on:
      group: triton
      labels: [self-hosted, APP]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # Cargo.toml is attacker-controlled on a fork pull request, so the
      # value is validated to a bare version number before it is used,
      # and passed through the environment rather than interpolated into
      # a shell command.
      - name: read and validate rust-version
        id: msrv
        run: |
          v=$(grep -m1 '^rust-version' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          printf '%s' "$v" | grep -qxE '[0-9]+\.[0-9]+(\.[0-9]+)?' \
            || { echo "refusing to use rust-version '$v'" >&2; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - name: install the MSRV toolchain
        env:
          MSRV: ${{ steps.msrv.outputs.version }}
        run: rustup toolchain install "$MSRV" --profile minimal
      - name: check on the MSRV toolchain
        env:
          MSRV: ${{ steps.msrv.outputs.version }}
        run: >
          cargo "+$MSRV" check --locked
          -p vmm_api_common -p dladm -p vmm_core -p vmm_devices -p vmm_devices_testsupport
          -p vmm_config -p vmm_migrate -p vmm_hyperv -p vmm_machine -p vmm_boot
          -p vmm_metrics -p vmm_passthru -p vmm_virtio -p vmm_storage -p vmm_hid -p vmm_mantablock
          -p fhrun

  binaries:
    name: both binaries type-check
    runs-on:
      group: triton
      labels: [self-hosted, APP]
    steps:
      # The only job that builds rshyve, so the only one that needs the
      # libtpms submodule. Everything else names portable packages.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: true
      - run: rustup target add x86_64-unknown-illumos
      # vmm-tpm-sys drives an autotools build of the libtpms submodule
      # for rshyve. The runner image already carries these, but naming
      # them makes the dependency visible when the image changes.
      - name: install the libtpms build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake libtool pkg-config libssl-dev
      # firehyve compiles against the real target in the clippy-illumos
      # job, which is a superset of a check. rshyve cannot: it pulls
      # zstd-sys and the libtpms autotools build, which need a C
      # toolchain for the target and there is no illumos cross-cc here.
      # The host target compiles those natively instead, which still
      # type-checks every line of rshyve.
      #
      # `test`, not `check`: rshyve and firehyve hold 236 tests that no
      # job in this workflow ran. The control socket authorization
      # policy is among them, and its peer-credential test is gated to
      # Linux and macOS, so the illumos build host skips it. This runner
      # is the only machine that runs that test at all. None of these
      # three packages has a bench or example target, so nothing that
      # `--all-targets` compiled is lost.
      - run: cargo test --locked -p rshyve -p firehyve
      # rshyve is the VMM on the compute nodes and shares one stamp
      # rule with firehyve, but only firehyve was ever run. The step
      # above already links rshyve here, so this costs one relink.
      - name: rshyve reports the commit it was built from
        run: |
          set -euo pipefail
          rev="$(git rev-parse --short HEAD)"
          TRITON_BUILD_REV="$rev" cargo build --locked -p rshyve
          out="$(./target/debug/rshyve --version)"
          echo "$out"
          case "$out" in
            *"($rev)") ;;
            *) echo "expected a version naming $rev, got: $out" >&2; exit 1 ;;
          esac
          cargo build --locked -p rshyve
          out="$(./target/debug/rshyve --version)"
          echo "$out"
          case "$out" in
            *"(unstamped)") ;;
            *) echo "expected the unstamped marker, got: $out" >&2; exit 1 ;;
          esac
      # The vTPM crates ran in no job. They need the submodule and the
      # autotools deps this job already has, and their tests drive real
      # libtpms rather than a stub, so they belong here and nowhere
      # else. vmm_tpm_sys asserts the library answers TPM2_GetRandom,
      # which a build that silently produced no library cannot do.
      - run: cargo test --locked -p vmm_tpm -p vmm_tpm_sys
      # rshyve, the migrate agent and the two TPM crates cannot
      # cross-compile here (zstd-sys and the libtpms autotools build need
      # a C toolchain for the target), so this is the only place they can
      # be linted at all. It is the host target, so rshyve's
      # `cfg(target_os = "illumos")` bodies are NOT covered; CONTRIBUTING
      # records the workspace clippy run the illumos build host does.
      - run: >
          cargo clippy --locked --all-targets
          -p rshyve -p vmm_tpm -p vmm_tpm_sys
          -- -D warnings

  build-stamp:
    name: a release binary names a commit
    runs-on:
      group: triton
      labels: [self-hosted, APP]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # The firehyve in the platform image reported a commit that
      # resolves in no clone, because the build script ran git on a
      # build host that holds no repository. An operator who cannot map
      # a running VMM to a commit cannot tell which code runs a guest.
      - run: tools/check-build-stamp.sh
      # A gate nobody has watched fail is not known to work, and this
      # one had two blind spots: it read the wrappers and not the file
      # that holds the rule, and grep exits 2 on a missing file, which
      # `if grep` reads as "no match". Both run here.
      - name: the gate notices a build script that reads git, and one that moved
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          saved="$tmp/saved.rs"
          trap 'rm -rf "$tmp"' EXIT
          git archive HEAD | tar -x -C "$tmp"
          cd "$tmp"
          tools/check-build-stamp.sh
          rule=crates/vmm-machine/src/build_rev.rs
          cp "$rule" "$saved"
          printf 'fn f() { let _ = std::process::Command::new("git"); }\n' >> "$rule"
          if tools/check-build-stamp.sh; then
            echo "the gate passed with the shared rule reading git" >&2
            exit 1
          fi
          cp "$saved" "$rule"
          tools/check-build-stamp.sh
          rm bin/rshyve/build.rs
          if tools/check-build-stamp.sh; then
            echo "the gate passed with a build script gone" >&2
            exit 1
          fi
      # The driver half of the stamp decides what the binary names, and
      # it has failed twice: a git that answered for the repository
      # above the tree, and a status that local configuration blinded.
      - run: tools/build-rev-test.sh
      - run: shellcheck -S warning tools/*.sh
      # rshyve shares the rule and is asserted in the `binaries` job: a
      # release build of it here would drive the libtpms autotools
      # build a second time.
      - name: a release build carries the commit it was built from
        run: |
          set -euo pipefail
          rev="$(git rev-parse --short HEAD)"
          TRITON_BUILD_REV="$rev" cargo build --locked --release -p firehyve
          out="$(./target/release/firehyve --version)"
          echo "$out"
          case "$out" in
            *"($rev)") ;;
            *) echo "expected a version naming $rev, got: $out" >&2; exit 1 ;;
          esac
          [ "$(git cat-file -t "$rev")" = commit ]
      # The driver builds from a working tree, not from a commit, so
      # the marker it appends has to survive to the binary: an operator
      # reading a bare commit name on a modified tree is told the wrong
      # thing.
      - name: a build from a changed tree says so
        run: |
          set -euo pipefail
          rev="$(git rev-parse --short HEAD)-dirty"
          TRITON_BUILD_REV="$rev" cargo build --locked --release -p firehyve
          out="$(./target/release/firehyve --version)"
          echo "$out"
          case "$out" in
            *"($rev)") ;;
            *) echo "expected a version naming $rev, got: $out" >&2; exit 1 ;;
          esac
      # Watch the fallback before trusting the steps above: a build the
      # driver did not stamp must say so rather than name a commit it
      # cannot prove.
      - name: an unstamped build says unstamped
        run: |
          set -euo pipefail
          cargo build --locked --release -p firehyve
          out="$(./target/release/firehyve --version)"
          echo "$out"
          case "$out" in
            *"(unstamped)") ;;
            *) echo "expected the unstamped marker, got: $out" >&2; exit 1 ;;
          esac

  supply-chain:
    name: advisories, licenses, sources
    runs-on:
      group: triton
      labels: [self-hosted, APP]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check advisories bans licenses sources

  secrets:
    name: secret scan
    runs-on:
      group: triton
      labels: [self-hosted, APP]
    env:
      # Pinned by version and digest. The gitleaks binary is MIT; the
      # gitleaks-action wrapper is deliberately not used because it
      # requires a paid license key for repositories owned by an
      # organization and exits 1 without one, which would make this a
      # permanently red required check.
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: install gitleaks
        run: |
          set -euo pipefail
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL "$url" -o gitleaks.tar.gz
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar xzf gitleaks.tar.gz gitleaks
      # Scans the history reachable from HEAD. Without --log-opts gitleaks
      # runs `git log --all`, and fetch-depth 0 fetches every branch, so
      # an unrelated branch could fail this PR.
      - run: >
          ./gitleaks detect --source . --config .gitleaks.toml --redact
          --no-banner --log-opts=HEAD

  boundary:
    name: firehyve dependency boundary
    runs-on:
      group: triton
      labels: [self-hosted, APP]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # Scoping the crate graph to one workspace member is what makes
      # this a per-binary gate. `cargo tree -i` cannot serve here: it
      # exits 0 both when a crate is present and when it is filtered out.
      #
      # Setting `arguments` drops the action's default --all-features,
      # which is intended. All-features would enable optional
      # dependencies a real firehyve build never links, so this job sees
      # a different dependency view from the supply-chain job above.
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          manifest-path: ./bin/firehyve/Cargo.toml
          arguments: --locked --config deny-firehyve.toml --target x86_64-unknown-illumos --exclude-dev
          command: check bans
      # Two silent failures cargo-deny cannot report: an unmatched `deny`
      # entry, and a missing --config that falls back to the default.
      - run: tools/check-boundary-bans.sh

  platform-deps:
    name: stock-PI dependency gate self-test
    runs-on:
      group: triton
      labels: [self-hosted, APP]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # The gate itself runs on the illumos build host, where rshyve is
      # actually linked; see tools/remote-build.sh. What CI can prove is
      # that the script is not silently broken, which is the failure
      # that would matter most: a gate that always passes is worse than
      # no gate. A syntax error and a missed rejection are both caught
      # here. Any Linux binary needs libc.so.6, which no platform image
      # ships, so the script must reject it.
      - run: sh -n tools/check-needed.sh
      - name: the gate rejects a binary the platform image cannot run
        run: |
          # Without readelf the script exits 1 for want of a reader,
          # which would pass the test below for the wrong reason.
          command -v readelf
          if tools/check-needed.sh "$(command -v true)"; then
            echo "check-needed.sh accepted a non-illumos binary" >&2
            exit 1
          fi

  public-surface:
    name: public surface guard
    runs-on:
      group: triton
      labels: [self-hosted, APP]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The commit messages of the pushed range are scanned too, so
          # the range has to be reachable.
          fetch-depth: 0
      # Event fields go through the environment, not the command line:
      # a pull request title or ref is attacker-controlled text.
      - name: scan the tree and the commit messages of this range
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          case "$EVENT" in
            pull_request) range="$BASE..$HEAD_SHA" ;;
            *)
              # A new branch reports an all-zero "before".
              if printf '%s' "$BEFORE" | grep -qxE '0+'; then
                range="$HEAD_SHA~1..$HEAD_SHA"
              else
                range="$BEFORE..$HEAD_SHA"
              fi
              ;;
          esac
          tools/public-surface.sh --commits "$range"
      # A commit message carrying a lab address once reached master past
      # the tree guard. Watch the message scan fail before trusting it.
      # The tree of this clone is the tree the step above just passed, so
      # the only hit can be the planted message, and the output is
      # checked for it: a failure for any other reason would pass this
      # step for the wrong reason.
      - name: the guard fails on a planted address in a commit message
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          git clone -q . "$tmp/clone"
          cd "$tmp/clone"
          git config user.email ci@example.com
          git config user.name ci
          # Assembled at run time: the literal would trip the guard on
          # this file, which is the guard doing its job.
          third=168
          git commit -q --allow-empty -m "test" -m "host root@192.$third.0.1 here"
          rc=0
          out="$(tools/public-surface.sh --commits HEAD~1..HEAD 2>&1)" || rc=$?
          printf '%s\n' "$out"
          if [ "$rc" -ne 1 ]; then
            echo "the guard answered $rc with a lab address in a commit message, wanted 1" >&2
            exit 1
          fi
          printf '%s\n' "$out" | grep -q 'commit message' \
            || { echo "the guard failed, but not on the commit message" >&2; exit 1; }
      # The guard stops private data reaching a public repository, so a
      # silent pass is its worst failure, and it had one: a `git grep`
      # that failed was read as "no hits". Outside a checkout it printed
      # a git error and then reported clean, which is what the illumos
      # build host does with an extracted tarball. A guard nobody has
      # watched fail is not known to work, so both failures run here.
      - name: the guard fails on a planted address, and refuses a tree it cannot list
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          elsewhere="$(mktemp -d)"
          trap 'rm -rf "$tmp" "$elsewhere"' EXIT
          # An extracted archive is what the build host has: no checkout.
          git archive HEAD | tar -x -C "$tmp"
          # Assembled at run time, because the literal would trip the
          # guard on this file, which is the guard doing its job. The
          # address is a generic RFC 1918 one the guard also matches:
          # this file is public, so it must not carry a real host.
          third=168
          printf 'root@192.%s.0.1\n' "$third" > "$tmp/docs/ci-self-test.md"
          if "$tmp/tools/public-surface.sh"; then
            echo "the guard reported clean with a lab address in the tree" >&2
            exit 1
          fi
          rm "$tmp/docs/ci-self-test.md"
          "$tmp/tools/public-surface.sh"
          # A listing that misses this tree must refuse. An empty answer
          # read as a clean one is the failure this step exists for.
          mkdir -p "$elsewhere/tools"
          cp "$tmp/tools/public-surface.sh" "$elsewhere/tools/"
          rc=0
          "$elsewhere/tools/public-surface.sh" || rc=$?
          if [ "$rc" -ne 2 ]; then
            echo "the guard answered $rc outside its own tree, wanted 2" >&2
            exit 1
          fi

  unsafe-safety:
    name: every unsafe block is justified
    runs-on:
      group: triton
      labels: [self-hosted, APP]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # 280 unsafe blocks and 5 `// SAFETY:` comments is the first thing
      # an outside reviewer of a hypervisor counts. A flag day is not on
      # offer, so tools/safety-budget.txt records the per-crate count and
      # this holds it down. Adding an unsafe block without a comment
      # fails; documenting one and not lowering the budget fails too, so
      # the number cannot drift either way.
      - run: tools/check-safety-comments.py
      # A gate nobody has watched fail is not known to work. The copy is
      # an extracted archive, which is also what the illumos build host
      # has: no checkout, so the gate falls back to a filesystem walk.
      # A listing it cannot build must refuse, not report clean.
      - name: the gate notices an undocumented block and a stale budget
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          git archive HEAD | tar -x -C "$tmp"
          cd "$tmp"
          tools/check-safety-comments.py | grep -q 'from a filesystem walk'
          printf 'fn f() { let _ = unsafe { 1 }; }\n' > crates/vmm-core/src/ci_self_test.rs
          if tools/check-safety-comments.py; then
            echo "the gate passed with an undocumented unsafe block added" >&2
            exit 1
          fi
          rm crates/vmm-core/src/ci_self_test.rs
          tools/check-safety-comments.py
          sed -i 's/^crates\/vmm-core .*/crates\/vmm-core 9999/' tools/safety-budget.txt
          if tools/check-safety-comments.py; then
            echo "the gate passed with a budget nobody lowered" >&2
            exit 1
          fi

  ci-coverage:
    name: every portable crate is named by a job
    runs-on:
      group: triton
      labels: [self-hosted, APP]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # A crate that no `-p` list names is unlinted and untested code
      # this workflow reports green, which is how the vmm-devices split
      # nearly lost five crates. The script derives its list from the
      # workspace members, so a new crate fails here until a job names
      # it. It failed closed but ran on no machine before this.
      - run: tools/check-ci-crates.sh
      # The gate itself failed closed but had a blind spot: a crate it
      # exempted was asserted nowhere, so the workflow could stop naming
      # it and this job stayed green. Watch it fail before trusting it.
      - name: the gate notices a crate dropped from the jobs that cover it
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          git archive HEAD | tar -x -C "$tmp"
          ci="$tmp/.github/workflows/ci.yml"
          # Named through a variable so this file does not carry the
          # literal the step strips, which would count itself.
          crate=viona_api
          before="$(grep -c -- "-p $crate" "$ci")"
          sed "s/ -p $crate//g" "$ci" > "$ci.cut"
          mv "$ci.cut" "$ci"
          # grep prints 0 and exits 1 when it matches nothing, and prints
          # nothing when it cannot read the file. Only the first is
          # expected here.
          after="$(grep -c -- "-p $crate" "$ci" || true)"
          [ -n "$after" ] || { echo "cannot read the workflow copy" >&2; exit 1; }
          # A defect that did not land would make the check below pass
          # for the wrong reason, which is the failure this job is about.
          if [ "$before" -lt 2 ] || [ "$after" -ne 0 ]; then
            echo "the defect did not land: $before job lists named $crate, $after still do" >&2
            exit 1
          fi
          if (cd "$tmp" && tools/check-ci-crates.sh); then
            echo "the gate reported full coverage with $crate dropped from every job" >&2
            exit 1
          fi

  test-parity:
    name: illumos and CI compile the same tests
    runs-on:
      group: triton
      labels: [self-hosted, APP]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: rustup target add x86_64-unknown-illumos
      # Every job above runs on ubuntu, so a test behind
      # `cfg(target_os = "illumos")` runs on no machine here, and a test
      # behind `cfg(not(target_os = "illumos"))` never runs on the
      # product platform. Both have shipped on this tree, and both were
      # found by hand: nine tests were exercising empty stubs, two
      # security tests ran nowhere, and 26 of 29 viona tests were
      # compiled out on the target. Nothing reported any of it.
      #
      # The script counts both sides instead of reading the gates. It
      # asks rustc for the test list of each target, compares the two,
      # and fails when the set of platform-gated tests moves away from
      # tools/test-parity.expected. Recording a change is a deliberate
      # edit, so drift becomes a reviewed decision.
      #
      # A list for a target nobody can execute comes from the MIR: the
      # test harness rustc builds names every test it kept. The reader
      # is not trusted, it is checked. The same run builds and lists
      # this runner's tests and asserts the reader returns exactly those
      # names. On this runner the checked side is the CI side of the
      # comparison. Run the script on the illumos build host with
      # --check-reader to check the other side against a real harness.
      #
      # The job also compiles every reachable package for illumos with
      # its test targets, so illumos-only code that stopped compiling
      # fails here. It reads the workspace members rather than a
      # hand-kept `-p` list, so it reaches a new package on the day it
      # is added.
      #
      # It stays quiet about rshyve, vmm_migrate and the two TPM crates.
      # Their dependencies compile C for the target and this runner has
      # no illumos cross-cc. The build host covers them.
      - run: tools/check-test-parity.py
