name: guest kernel

# Builds the Linux guest kernel a sandbox VM boots, and publishes it.
#
# Why it is a workflow and not a build-host task: kernel/build.sh
# composes its config fragments inside a digest-pinned linux/amd64
# container, and the illumos build host has no container runtime. Every
# other job in this repository already runs on ubuntu-latest.
#
# Why it exists at all: .gitignore keeps kernel/vmlinux-* and
# kernel/vmlinuz-* out of the tree, because the images are GPL-2.0 and
# their source is not tracked. Without this workflow the only copy of a
# guest kernel is on the machine that last ran build.sh, and no reader
# can tell which fragments went into it.
#
# What a green run proves: the fragment list composes, olddefconfig kept
# every option the fragments asked for and dropped the one they asked it
# to drop, the ELF carries the PVH note, and the image holds the SMP and
# vsock code. It does NOT prove the kernel boots. Only a VMM on illumos
# can show that.

on:
  push:
    branches: [master]
    paths:
      - kernel/**
      - .github/workflows/guest-kernel.yml
  pull_request:
    paths:
      - kernel/**
      - .github/workflows/guest-kernel.yml
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

env:
  KERNEL_VERSION: "6.12.13"
  # kernel/sandbox.config records why each fragment is here. Two rules
  # this list must keep:
  #
  #   sandbox.config last. kconfig keeps the LAST assignment of an
  #   option, and sandbox.config is the fragment that switches one OFF.
  #
  #   container.config and smp.config together. CONFIG_CPUSETS needs
  #   CGROUPS from the first and SMP from the second, and olddefconfig
  #   drops it without a word when either is missing.
  #
  # hotplug.config must stay out: it sets CONFIG_SMP and CONFIG_NR_CPUS
  # itself, so with smp.config the vCPU ceiling would follow fragment
  # order. The assertion step below fails if it is ever added here.
  FRAGMENTS: "container.config vsock.config smp.config rng.config virtiofs.config sandbox.config"
  OUT_SUFFIX: "-sandbox"

jobs:
  build:
    name: sandbox guest kernel
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # build.sh pulls a digest-pinned Alpine image from Docker Hub and
      # a kernel tarball from cdn.kernel.org, and verifies the tarball
      # against the SHA-256 it records. The tarball is not cached here:
      # a cache entry would be one more thing to trust, and the download
      # is small next to the compile.
      - name: build the kernel
        working-directory: kernel
        run: |
          KERNEL_EXTRA_CONFIG="$FRAGMENTS" \
          KERNEL_OUT_SUFFIX="$OUT_SUFFIX" \
              ./build.sh "$KERNEL_VERSION"

      # build.sh asserts this too, inside the container. It is repeated
      # here on the config it wrote out, for two reasons: this step
      # names the options the sandbox cannot run without, so a reader
      # sees them, and it matches whole lines rather than prefixes.
      #
      # It reports every failure before it exits, so one run names every
      # option that went missing.
      - name: every option the fragments asked for survived olddefconfig
        working-directory: kernel
        run: |
          set -euo pipefail
          cfg="config-fastboot${OUT_SUFFIX}"
          rc=0

          # hotplug.config sets CONFIG_SMP and CONFIG_NR_CPUS itself.
          case " $FRAGMENTS " in
            *" hotplug.config "*)
              echo "FAIL: hotplug.config conflicts with smp.config on the CPU count"
              rc=1
              ;;
          esac

          # Everything the fragments turn on.
          while read -r opt; do
            [ -n "$opt" ] || continue
            grep -Fxq "$opt" "$cfg" || { echo "FAIL: $opt is not in $cfg"; rc=1; }
          done <<< "$(for f in $FRAGMENTS; do grep -o '^CONFIG_[A-Z0-9_]*=y' "$f" || true; done)"

          # The options without which the sandbox has no control
          # channel, no CPU accounting and no direct boot. CONFIG_NR_CPUS
          # is named on its own: the loop above only reads "=y" lines, so
          # a vCPU ceiling silently clamped to 1 would pass it.
          for opt in \
              CONFIG_PVH=y \
              CONFIG_SMP=y \
              CONFIG_NR_CPUS=8 \
              CONFIG_CPUSETS=y \
              CONFIG_VSOCKETS=y \
              CONFIG_VIRTIO_VSOCKETS=y; do
            grep -Fxq "$opt" "$cfg" || { echo "FAIL: $opt is not in $cfg"; rc=1; }
          done

          exit $rc

      # The guest runs untrusted code, so an option the fragments switch
      # OFF matters as much as one they switch on. This is the check
      # that fails closed if sandbox.config is emptied or deleted: an
      # absent negative list is the same blind spot as a dropped option.
      - name: the guest has no in-guest vsock path
        working-directory: kernel
        run: |
          set -euo pipefail
          cfg="config-fastboot${OUT_SUFFIX}"
          rc=0

          negatives="$(sed -n 's/^# \(CONFIG_[A-Z0-9_]*\) is not set$/\1/p' sandbox.config)"
          if [ -z "$negatives" ]; then
            echo "FAIL: sandbox.config names no option to switch off"
            exit 1
          fi
          grep -qx CONFIG_VSOCKETS_LOOPBACK <<< "$negatives" || {
            echo "FAIL: sandbox.config no longer switches CONFIG_VSOCKETS_LOOPBACK off"
            rc=1
          }

          while read -r sym; do
            [ -n "$sym" ] || continue
            ! grep -q "^$sym=" "$cfg" || { echo "FAIL: $sym is set in $cfg"; rc=1; }
          done <<< "$negatives"

          exit $rc

      # The config says what was asked for. These two say what is in the
      # image. objcopy --strip-all drops the symbol table but keeps the
      # allocatable sections, so the printk and driver-name literals in
      # .rodata survive.
      #
      # "smpboot: " is the pr_fmt prefix of arch/x86/kernel/smpboot.c,
      # which the x86 Makefile builds only under CONFIG_SMP. The
      # uniprocessor kernels in this tree carry none of it and the SMP
      # ones carry 13 such strings.
      #
      # "vmw_vsock_virtio_transport" is KBUILD_MODNAME for
      # net/vmw_vsock/virtio_transport.c, used as the virtio driver
      # name, so it appears only when CONFIG_VIRTIO_VSOCKETS is built.
      - name: the image carries the PVH note, the SMP code and the vsock transport
        working-directory: kernel
        run: |
          set -euo pipefail
          img="vmlinux-fastboot${OUT_SUFFIX}"
          rc=0

          # Each producer writes to a file first. Piping into `grep -q`
          # under `pipefail` fails on a GOOD image: grep exits at the
          # first match, the producer takes a SIGPIPE, and the pipeline
          # reports the signal.
          notes="$RUNNER_TEMP/notes.txt"
          text="$RUNNER_TEMP/strings.txt"
          readelf -n "$img" > "$notes"
          strings -a "$img" > "$text"

          grep -qi xen "$notes" || { echo "FAIL: no PVH note in $img"; rc=1; }
          grep -q 'smpboot: ' "$text" || { echo "FAIL: no SMP boot code in $img"; rc=1; }
          grep -q 'vmw_vsock_virtio_transport' "$text" || {
            echo "FAIL: no virtio vsock transport in $img"
            rc=1
          }
          exit $rc

      # The digests travel with the images, so an operator can tell
      # which kernel a CN is running without trusting the file name.
      - name: record the digests
        working-directory: kernel
        run: |
          set -euo pipefail
          sha256sum \
              "vmlinux-fastboot${OUT_SUFFIX}" \
              "vmlinuz-fastboot${OUT_SUFFIX}" \
              "config-fastboot${OUT_SUFFIX}" \
              | tee "SHA256SUMS${OUT_SUFFIX}"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: guest-kernel${{ env.OUT_SUFFIX }}
          if-no-files-found: error
          retention-days: 90
          path: |
            kernel/vmlinux-fastboot${{ env.OUT_SUFFIX }}
            kernel/vmlinuz-fastboot${{ env.OUT_SUFFIX }}
            kernel/config-fastboot${{ env.OUT_SUFFIX }}
            kernel/SHA256SUMS${{ env.OUT_SUFFIX }}

  # A workflow artifact expires. A kernel a CN boots must not, so a
  # published release gets its own copy.
  attach:
    name: attach the kernel to the release
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: guest-kernel${{ env.OUT_SUFFIX }}
          path: out
      # The tag arrives as an environment value rather than inside the
      # script text, so it cannot be read as shell.
      - name: upload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" out/* --clobber
